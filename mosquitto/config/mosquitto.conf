# Mosquitto MQTT Broker - Temel Konfigürasyon
# Geliştirme/test ortamı içindir. Üretimde mutlaka kullanıcı adı/şifre
# ve TLS eklenmelidir (authentication ve encryption olmadan broker
# herkese açık kalır).

# Broker'ın dinleyeceği port (MQTT standart portu)
listener 1883

# Şimdilik anonim (kullanıcı adı/şifre olmadan) bağlantıya izin ver.
# Bu SADECE yerel geliştirme için güvenlidir.
allow_anonymous true

# Log ayarları
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
 